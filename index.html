<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lost Memories">
<title>Lost Memories</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="appbar">
  <img class="logo" src="icons/icon-192.png" alt="">
  <div class="brand"><b>Lost Memories</b><span id="syncInfo">در حال آماده شدن…</span></div>
  <button class="icon-btn" id="syncBtn" aria-label="همگام‌سازی" title="همگام‌سازی">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 11a8 8 0 0 0-14.9-3.9M4 4v4h4M4 13a8 8 0 0 0 14.9 3.9M20 20v-4h-4"/></svg>
  </button>
</header>

<div class="searchwrap" id="searchWrap">
  <div class="search">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="جستجو: اسم، اسم ژاپنی، اسم فایل…" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="qClear" aria-label="پاک کردن">×</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="chips genres" id="genres"></div>
</div>

<div class="banner" id="banner" hidden></div>
<main id="main"></main>

<nav class="bottomnav" id="nav">
  <button data-view="shows" class="on"><span class="ic">📺</span><span>سریال‌ها</span></button>
  <button data-view="schedule"><span class="ic">📅</span><span>برنامه‌ی پخش</span></button>
  <button data-view="movies"><span class="ic">🎬</span><span>فیلم‌ها</span></button>
  <button data-view="more"><span class="ic">⚙️</span><span>بیشتر</span></button>
</nav>

<dialog id="sheet" class="sheet">
  <div class="sheet-bar">
    <button class="icon-btn" id="sheetClose" aria-label="بازگشت">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
    <b id="sheetTitle"></b>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</dialog>

<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
